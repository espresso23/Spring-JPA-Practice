<!DOCTYPE html>
<html lang="en">
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h2>Edit form</h2>
<div th:if="${successMessage}" class="alert alert-success"
     style="color: green; padding: 10px; margin: 10px 0; border: 1px solid green;">
    <span th:text="${successMessage}"></span>
</div>

<!-- Hiển thị thông báo lỗi -->
<div th:if="${errorMessage}" class="alert alert-danger"
     style="color: red; padding: 10px; margin: 10px 0; border: 1px solid red;">
    <span th:text="${errorMessage}"></span>
</div>
<form id="editForm" th:action="@{/dangky/update/{maDK}(maDK=${dangKyLamThem.maDK})}" method="post"
      th:object="${dangKyLamThem}">
    <h2>Chỉnh sửa đăng ký</h2>
    <input type="hidden" id="maDKEdit" th:field="*{maDK}">

    <label for="maNV">Mã NV:</label>
    <input type="text" id="maNV" th:field="*{maNV}" required><br/>

    <label for="hoTen">Họ Tên:</label>
    <input type="text" id="hoTen" th:field="*{hoTen}" required><br/>

    <label for="gioiTinh">Giới Tính:</label>
    <select id="gioiTinh" th:field="*{gioiTinh}">
        <option value="Nam">Nam</option>
        <option value="Nữ">Nữ</option>
    </select><br/>

    <label for="capBac">Cấp Bậc:</label>
    <select id="capBac" th:field="*{capBac}" required>
        <option value="1">Cấp 1</option>
        <option value="2">Cấp 2</option>
        <option value="3">Cấp 3</option>
    </select><br/>

    <label for="maVL">Mã Việc Làm:</label>
    <input type="text" id="maVL" th:field="*{viecLam.maVL}" required><br/>

    <label for="soNgayCong">Số Ngày Công:</label>
    <input type="number" id="soNgayCong" th:field="*{soNgayCong}" required min="1" max="20"><br/>

    <button type="submit">Cập nhật</button>
</form>

</body>
</html>
